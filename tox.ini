[tox]
envlist = flake8, mypy, py39, py310, py311, py312
toxworkdir = {env:TOX_WORK_DIR:.tox}

[testenv]
deps =
  -e .[dev]
setenv = HOME = {envtmpdir}
commands =
  pytest -v

[testenv:flake8]
deps =
  flake8>=6,<8
commands =
  flake8 parser_2gis tests

[gh-actions]
python =
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312

[testenv:mypy]
deps =
  mypy==0.950
  types-requests==2.27.25

commands =
  mypy {posargs}
